<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mantenimiento de Lugares | Tickets Sadi</title>

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

	<!-- Firebase (servido por Firebase Hosting) -->
	<script defer src="/__/firebase/13.2.0/firebase-app-compat.js"></script>
	<script defer src="/__/firebase/13.2.0/firebase-firestore-compat.js"></script>
	<script defer src="/__/firebase/init.js"></script>
</head>
<body>
	<div id="menu_Principal"></div>

	<main class="container">
		<section class="encabezado_Modulo">
			<h2 class="h4 mb-1">Mantenimiento de Lugares</h2>
			<p class="text-muted mb-2">Estadios, anfiteatros y recintos donde se realizan los eventos.</p>
			<span class="badge bg-secondary">Responsable: Diana</span>
		</section>

		<div class="row g-3">
			<!-- formulario: crear y modificar -->
			<div class="col-lg-4">
				<div class="caja_Blanca">
					<h5 id="titulo_Formulario">Nuevo lugar</h5>
					<form id="form_Lugar">
						<input type="hidden" id="txt_Id">
						<div class="mb-2">
							<label class="form-label" for="txt_Nombre">Nombre</label>
							<input type="text" class="form-control" id="txt_Nombre" required>
						</div>
						<div class="mb-2">
							<label class="form-label" for="cbo_Provincia">Provincia</label>
							<select class="form-select" id="cbo_Provincia" required></select>
						</div>
						<div class="mb-2">
							<label class="form-label" for="txt_Direccion">Dirección</label>
							<input type="text" class="form-control" id="txt_Direccion" required>
						</div>
						<div class="mb-3">
							<label class="form-label" for="txt_Capacidad">Capacidad (personas)</label>
							<input type="number" class="form-control" id="txt_Capacidad" min="1" step="1" required>
						</div>
						<button type="submit" class="btn btn-primary" id="btn_Guardar">Guardar</button>
						<button type="button" class="btn btn-outline-secondary" id="btn_Cancelar">Cancelar</button>
					</form>
				</div>
			</div>

			<!-- consultas y listado -->
			<div class="col-lg-8">
				<div class="caja_Blanca">
					<div class="row g-2 mb-3">
						<div class="col-sm-6">
							<label class="form-label small" for="cbo_Filtro_Provincia">Consulta 1: por provincia</label>
							<select class="form-select form-select-sm" id="cbo_Filtro_Provincia"></select>
						</div>
						<div class="col-sm-6">
							<label class="form-label small" for="txt_Filtro_Capacidad">Consulta 2: capacidad mínima</label>
							<input type="number" class="form-control form-control-sm" id="txt_Filtro_Capacidad" min="0" placeholder="Ej.: 10000">
						</div>
					</div>
					<div class="table-responsive">
						<table class="table align-middle mb-2">
							<thead>
								<tr><th>Nombre</th><th>Provincia</th><th>Dirección</th><th>Capacidad</th><th></th></tr>
							</thead>
							<tbody id="tabla_Lugares">
								<tr><td colspan="5" class="text-center text-muted">Cargando…</td></tr>
							</tbody>
						</table>
					</div>
					<button class="btn btn-outline-secondary btn-sm" disabled title="Se implementa en el segundo 50% del proyecto">Reporte PDF (pendiente)</button>
				</div>
			</div>
		</div>
	</main>

	<div id="pie_Pagina"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/layout.js"></script>
	<script defer src="js/utilidades.js"></script>
	<script defer src="js/mantenimiento_Lugares.js"></script>
</body>
</html>
