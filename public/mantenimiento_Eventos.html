<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mantenimiento de Eventos | Tickets Sadi</title>

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

	<!-- Firebase (servido por Firebase Hosting) -->
	<script defer src="/__/firebase/13.2.0/firebase-app-compat.js"></script>
	<script defer src="/__/firebase/13.2.0/firebase-firestore-compat.js"></script>
	<script defer src="/__/firebase/init.js"></script>
</head>
<body>
	<div id="menu_Principal"></div>

	<main class="container">
		<section class="encabezado_Modulo">
			<h2 class="h4 mb-1">Mantenimiento de Eventos</h2>
			<p class="text-muted mb-2">Conciertos, festivales y partidos que se venden en la plataforma.</p>
			<span class="badge bg-secondary">Responsable: Diana</span>
		</section>

		<div class="row g-3">
			<!-- formulario: crear y modificar -->
			<div class="col-lg-4">
				<div class="caja_Blanca">
					<h5 id="titulo_Formulario">Nuevo evento</h5>
					<form id="form_Evento">
						<input type="hidden" id="txt_Id">
						<div class="mb-2">
							<label class="form-label" for="txt_Nombre">Nombre del evento</label>
							<input type="text" class="form-control" id="txt_Nombre" required>
						</div>
						<div class="mb-2">
							<label class="form-label" for="cbo_Categoria">Categoría</label>
							<select class="form-select" id="cbo_Categoria" required></select>
						</div>
						<div class="mb-2">
							<label class="form-label" for="cbo_Lugar">Lugar</label>
							<select class="form-select" id="cbo_Lugar" required></select>
							<div class="form-text" id="lbl_Sin_Lugares"></div>
						</div>
						<div class="mb-2">
							<label class="form-label" for="txt_Fecha">Fecha y hora</label>
							<input type="datetime-local" class="form-control" id="txt_Fecha" required>
						</div>
						<div class="mb-2">
							<label class="form-label" for="txt_Descripcion">Descripción</label>
							<textarea class="form-control" id="txt_Descripcion" rows="3" required></textarea>
						</div>
						<div class="mb-2">
							<label class="form-label" for="cbo_Estado">Estado</label>
							<select class="form-select" id="cbo_Estado" required></select>
						</div>
						<div class="mb-3">
							<label class="form-label" for="txt_Imagen">Imagen del evento</label>
							<input type="file" class="form-control" id="txt_Imagen" disabled>
							<div class="form-text">Pendiente: requiere activar Cloud Storage.</div>
						</div>
						<button type="submit" class="btn btn-primary" id="btn_Guardar">Guardar</button>
						<button type="button" class="btn btn-outline-secondary" id="btn_Cancelar">Cancelar</button>
					</form>
				</div>
			</div>

			<!-- consultas y listado -->
			<div class="col-lg-8">
				<div class="caja_Blanca">
					<div class="row g-2 mb-3">
						<div class="col-sm-4">
							<label class="form-label small" for="cbo_Filtro_Categoria">Consulta 1: por categoría</label>
							<select class="form-select form-select-sm" id="cbo_Filtro_Categoria"></select>
						</div>
						<div class="col-6 col-sm-4">
							<label class="form-label small" for="txt_Filtro_Desde">Consulta 2: desde</label>
							<input type="date" class="form-control form-control-sm" id="txt_Filtro_Desde">
						</div>
						<div class="col-6 col-sm-4">
							<label class="form-label small" for="txt_Filtro_Hasta">hasta</label>
							<input type="date" class="form-control form-control-sm" id="txt_Filtro_Hasta">
						</div>
					</div>
					<div class="table-responsive">
						<table class="table align-middle mb-2">
							<thead>
								<tr><th>Evento</th><th>Categoría</th><th>Lugar</th><th>Fecha</th><th>Estado</th><th></th></tr>
							</thead>
							<tbody id="tabla_Eventos">
								<tr><td colspan="6" class="text-center text-muted">Cargando…</td></tr>
							</tbody>
						</table>
					</div>
					<button class="btn btn-outline-secondary btn-sm" disabled title="Se implementa en el segundo 50% del proyecto">Reporte PDF (pendiente)</button>
				</div>
			</div>
		</div>
	</main>

	<div id="pie_Pagina"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/layout.js"></script>
	<script defer src="js/utilidades.js"></script>
	<script defer src="js/mantenimiento_Eventos.js"></script>
</body>
</html>
